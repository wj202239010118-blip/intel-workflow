# iGaming 行业日报 · 每天自动跑（设备关机也能跑）
#
# 取数全程纯 HTTP（RSS / sitemap）—— runner 上不需要 node、也不需要 playwright。
#
# sbcnews 的配图（2026-10-14 定论）：它整站对普通 HTTP 一律 403，图在独立子域
# （resources.sbcnews.co.uk）而文件名无从推导，只能由浏览器读文章页的 og:image；但云端是 GitHub
# runner（数据中心 IP），无头浏览器过不了 Cloudflare 挑战页（实测返回 403 "Just a moment..."）。
# 所以**不再在云端尝试**，sbcnews 那几条走无图占位（图是增强项，其余三站照常有图）。
# 本机有头浏览器能过那条挑战；若哪天想让**本机**补图：给 config.toml 加
# `[news.browser_og]` + `"sbcnews.co.uk" = true`，再把本工作流里 node + playwright 两步加回来即可。
# 默认**只落盘**：日报进 Actions artifact + 贴进 Run 页面摘要，不推任何群 / 邮件。
# 想推送：把 LARK_WEBHOOK（可选 LARK_SECRET）加进 Secrets，再把文末「可选推送」的 if 改成 true。
#
# 定时：由 Cloudflare Worker kol-ext-gateway 的 Durable Object alarm，每天 16:00 UTC
# （= 中国次日 00:00）调这里的 workflow_dispatch 触发。
# 为什么不是早上：四个站都是欧美行业媒体，UTC 01:30（中国 09:30）时伦敦才 02:30、
# 布宜诺斯艾利斯还在前一日 22:30 —— 当天稿一条都还没发（2026-10-13 实测：
# 伦敦当天稿 07:18–15:09 UTC 发、阿根廷 12:13–16:37 -03:00 发，故取 UTC 16:00）。
# 不用 GitHub 自带的 schedule —— 它高峰期会延迟、甚至跳过（2026-10-13 实测该跑的点没触发），
# 而且与 Worker 入口并存会导致同一天往群里发两条快讯。
name: news-daily

on:
  workflow_dispatch:            # 手动触发（首次验证 / 补跑 / Worker 定时调用）
    inputs:
      mark_only:                # 2026-10-19: 只写「今天已发」标记、不发 Lark（防重复骚扰时用）
        description: "只写已发标记，不发送任何 Lark 消息"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: news-daily
  cancel-in-progress: false     # 不并发：避免同一天的日报被写两遍

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 离线单测（不联网；抓取前先自检）
        run: python -m unittest discover -s tests

      - name: 抓取 + 整合英文日报（纯 HTTP，无浏览器）
        # 2026-10-18 用户定：云端**不抓图**（逐篇 16s 闸门 = 整轮 80% 时间，实测 336s → 49s）；
        #   图留给本地腿（本机跑 `intel news run` 不带 --no-images 即抓图）。
        run: python3 intel news run --out out --no-images

      - name: 生成每日热点页（静态 HTML，可托到边缘）
        env:
          # 云端没有本机 CLI → 分析走 GPT（OpenAI 兼容端点，已在 config.toml [collab] 配好并同步进 Secrets）
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python3 tools/daily_page.py --analyze --out out/daily.html

      - name: 推到边缘 KV（凭据齐全才发；缺凭据自动 dry-run）
        env:
          CF_API_TOKEN: ${{ secrets.CF_KV_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE: ${{ secrets.CF_KV_NAMESPACE }}
        run: |
          python3 tools/kv_put.py out/daily.html daily:index
          python3 tools/kv_put.py out/top.html daily:top        # 收录页（/?top，各家热门榜全收录）
          # 归档 key 与页面上的「this day's page」链接（/d/<date>）同一口径 = 中国日期
          python3 tools/kv_put.py out/daily.html "daily:$(TZ=Asia/Shanghai date +%F)"
          python3 tools/kv_put.py out/daily.json daily:json --content-type "application/json; charset=utf-8"

      - name: 推送到 Lark（前 10 条英文卡片；默认只打印）
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          LARK_SECRET: ${{ secrets.LARK_SECRET }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        # 2026-10-12：这一步与下面那条「内部群快讯」内容重叠，同一次 run 会发两条卡片，
        # 所以默认 dry-run（去掉 --send）。要恢复真发：把 run 改回 `--send`。
        run: python3 tools/push_top.py --top 10

      # 内部通知群快讯：与云腿 KOL 日报（kol-discover）用**同一个**自定义机器人。
      # 卡片是中文（内部群口吻，与云腿日报一致）→ 必须显式 --allow-cjk；
      # 对外的 push_top.py 仍是纯英文、走 push.assert_no_cjk，两者不混。
      # 没配 LARK_WEBHOOK 时脚本自己只打印，不会半路静默发送。
      # 2026-10-19(用户：机器人反复发同一条，构成骚扰)：**同一天只发一次**。
      #   幂等键 = KV `news:brief:<中国日期>`。存在 → 跳过；发送成功才写标记。
      - name: 发行业快讯到 Lark 内部通知群（同一天只发一次）
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          LARK_SECRET: ${{ secrets.LARK_SECRET }}
          CF_API_TOKEN: ${{ secrets.CF_KV_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE: ${{ secrets.CF_KV_NAMESPACE }}
          MARK_ONLY: ${{ inputs.mark_only }}
        run: |
          KEY="news:brief:$(TZ=Asia/Shanghai date +%F)"
          SENT="$(python3 tools/kv_get.py "$KEY" 2>/dev/null || true)"
          if [ "${MARK_ONLY:-false}" = "true" ]; then
            printf '%s' "$(TZ=Asia/Shanghai date '+%F %H:%M') (mark-only)" > /tmp/lark-sent
            python3 tools/kv_put.py /tmp/lark-sent "$KEY" --content-type "text/plain"
            echo "✍️ 只写标记，未发送（$KEY）"
            exit 0
          fi
          if [ -n "$SENT" ]; then
            echo "⏭ 今天已经发过快讯（$KEY = $SENT）→ 跳过（防重复骚扰）"
            exit 0
          fi
          python3 tools/news_brief.py --allow-cjk --send
          printf '%s' "$(TZ=Asia/Shanghai date '+%F %H:%M')" > /tmp/lark-sent
          python3 tools/kv_put.py /tmp/lark-sent "$KEY" --content-type "text/plain"

      - name: 归档日报（artifact，保留 90 天）
        uses: actions/upload-artifact@v4
        with:
          name: news-digest-${{ github.run_id }}
          path: |
            out/*-news-digest.md
            out/*-news.jsonl
            out/*-daily.html
          retention-days: 90
          if-no-files-found: error

      - name: 把今天的日报贴进 Run 摘要（打开 Actions 页面就能读）
        run: |
          {
            echo "## iGaming 日报 · $(date -u +%F) UTC"
            echo
            cat out/*-news-digest.md
          } >> "$GITHUB_STEP_SUMMARY"

      # 可选：推送（默认不做）。先把 LARK_WEBHOOK / LARK_SECRET 加进仓库 Secrets，
      # 再把 if 改成 true —— Lark 自定义机器人发出去的消息撤不回，务必先看过日报内容。
      #- name: 可选推送
      #  if: false
      #  env:
      #    LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
      #  run: python3 intel news push --send
