# 复制为 config.toml 后按需填写。全部可留空 —— 留空时只有需要该凭据的能力不可用，
# 其余照常工作，并给出明确的「缺什么、去哪申请」提示。

[youtube]
# YouTube Data API v3（免费额度足够做热点榜）
# 申请：Google Cloud Console → 启用 YouTube Data API v3 → 创建 API key
api_key = ""

[kick]
# Kick 官方 Public API 需要 app token
# 申请：https://dev.kick.com 建 app → 填 client_id / client_secret（脚本换 token 前先手动换一次也可）
client_id = ""
client_secret = ""
access_token = ""

[tiktok]
# 无需凭据：走 playwright 浏览器渲染公开趋势页。
# 需要可选组件：node + playwright（npm i playwright && npx playwright install chromium）
# 若 playwright 装在别处，用环境变量 INTEL_NODE_PATH 指向它的 node_modules。

[instagram]
# 无官方趋势接口：需自带 sessionid cookie，并配几个对标账号做「近期帖互动」代理指标
# 取 cookie：浏览器登录 IG → 开发者工具 → Application → Cookies → 复制 sessionid
session_id = ""
seed_accounts = []

[news]
# 每日检索的资讯站（列表页）。不填 sites/extra_sites 就用内置的一组 iGaming 行业站：
#   igaming.news / igamingbusiness.com / sbcnews.co.uk / yogonet.com
# sites = []          # 覆盖内置清单（每项 = 一个列表页 URL）
# extra_sites = []    # 在内置清单之后追加
per_site_limit = 15   # 每站最多取多少条
headless = false      # false = 有头浏览器（默认，同事要求）；true = 无头
# profile_dir = "~/.cache/intel-workflow/browser-profile"   # 持久 profile：cookie/登录态次次复用

[news.selectors]
# 通用启发式抽不准时，按域名指定「文章链接」的 CSS 选择器来校准（只有浏览器通道用得上）：
# "www.example.com" = "article h2 a"

[news.feeds]
# **首选通道**：站点有 RSS/Atom 就给在这里 —— 走普通 HTTP（无浏览器、无 consent 墙、无反爬），
# 比渲染页面稳得多也轻得多。内置四站里 sbcnews.co.uk / igamingbusiness.com / yogonet.com 走这条。
# "www.example.com" = "https://www.example.com/feed/"

[news.sitemaps]
# **次选通道**：站点没给 feed 时，XML sitemap 往往还在（同样是纯 HTTP，无浏览器、无 playwright）。
# 指向 /sitemap.xml（index）或直接指向子 sitemap 都行 —— 是 index 会自动跟到含 "news" 的子 sitemap。
# 内置四站里 igaming.news 走这条（它没有 RSS，只有 /news-sitemap.xml）。
# "www.example.com" = "https://www.example.com/sitemap.xml"

[push.lark]
# 飞书 / Lark 自定义机器人（群机器人）。默认关闭 —— 打开并真发之前先 dry-run 看内容。
# ⚠️ 自定义机器人发出去的消息**撤不回**（只能请群管理员删）：务必先 dry-run 确认。
enabled = false
webhook = ""
secret = ""      # 机器人开了「签名校验」才需要

[push.email]
enabled = false
host = ""
port = 465
user = ""
password = ""
sender = ""
to = []
subject_prefix = "[iGaming News] "

[schedule]
hour = 9        # 每天 9:30 跑；开机 / 登录时也会跑一次（当天已成功跑过则跳过）
minute = 30
send = false    # true = 定时任务真推送（默认只抓取落盘，不发）

[output]
dir = "out"

[gate]
# 按域名的抓取纪律（写进代码，不建议调大）
min_interval_seconds = 15      # 同一域名两次请求的最小间隔
daily_cap_per_domain = 200     # 每域名每日上限
cooldown_seconds = 21600       # 命中风控后的冷却时长（6h），冷却期内零请求

[collab]
# cross=总是交叉复核 / single=单模型 / auto=检测到两端就交叉
mode = "auto"
# 缺 codex 时的等价替代（任意 OpenAI 兼容端；不填则只用本机 CLI）
openai_base_url = ""
openai_api_key = ""
openai_model = ""
